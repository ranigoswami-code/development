<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registration Form</title>
    </head>

    <body>
        <h1 align="center"><u>Task 2:</u></h1>

        <table border="1" cellpadding="8" cellspacing="0">
            <th colspan="4" style="text-align:center">
                Registration Form
            </th>
            </tr>
            <tr>
                <td><b>Student Name</b></td>
                <td>
                    <input type="text" name="first_name" placeholder="First Name">
                </td>
                <td>
                    <input type="text" name="middle_name" placeholder="Middle Name">
                </td>
                <td>
                    <input type="text" name="last_name" placeholder="Last Name">
                </td>
            </tr>

            <tr>
                <td><b>Father's Name</b></td>
                <td>
                    <input type="text" name="father_name" placeholder="Enter your father's Name">
                </td>
                <td><b>Mother's Name</b></td>
                <td>
                    <input type="text" name="mother_name" placeholder="Enter your Mother's Name">
                </td>
            </tr>


            <tr>
                <td><b>Date of Birth</b></td>
                <td>
                    <input type="date" name="dob">
                </td>
                <td><b>Gender</b></td>
                <td>
                    <label><input type="radio" name="gender" value="Male"> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                </td>
            </tr>

            <tr>
                <td><b>Category</b></td>
                <td>
                    <label><input type="radio" name="category" value="Gen"> Gen</label>
                    <label><input type="radio" name="category" value="OBC"> OBC</label>
                    <label><input type="radio" name="category" value="SC/ST"> SC/ST</label>
                </td>
                <td><b>Handicapped</b></td>
                <td>
                    <label><input type="radio" name="handicapped" value="Yes"> Yes</label>
                    <label><input type="radio" name="handicapped" value="No"> No</label>
                </td>
            </tr>

            <tr>
                <td><b>Ex-Serviceman</b></td>
                <td>
                    <label><input type="radio" name="ex_serviceman" value="Yes"> Yes</label>
                    <label><input type="radio" name="ex_serviceman" value="NO"> NO</label>
                </td>
                <td><strong>EWS</strong></td>
                <td>
                    <label><input type="radio" name="ews" value="Yes"> Yes</label>
                    <label><input type="radio" name="ews" value="No"> No</label>
                </td>
            </tr>

            <tr>
                <td><b>Email ID</b></td>
                <td>
                    <input type="email" name="email">
                </td>
                <td><b>Mobile No.</b></td>
                <td>
                    <input type="number" name="mobile">
                </td>
            </tr>


            <tr>
                <td><b>State</b></td>
                <td>
                    <select name="state">
                        <option value="">Select any One</option>

                    </select>
                </td>
                <td><b>City</b></td>
                <td>
                    <select name="city">
                        <option value="">Select any One</option>

                    </select>
                </td>
            </tr>


            <tr>
                <td><b>Upload Photo</b></td>
                <td>
                    <input type="file" name="photo">
                </td>
                <td><b>Upload Signature</b></td>
                <td>
                    <input type="file" name="signature">
                </td>
            </tr>


            <tr>
                <td colspan="2"></td>
                <td colspan="2">
                    <input type="submit" value="Submit">
                </td>
            </tr>
        </table>
        <h3><u>🎵 Audio Section (Farm Vibes / Celebration)</u></h3>
        

    </body>

</html>
